<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOLCHDECK — Sidescroller-Deckbuilder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-root">

  <div id="screen-start" class="screen"></div>

  <div id="screen-sidescroller" class="screen hidden">
    <canvas id="game-canvas" width="960" height="360"></canvas>
    <div class="exit-row">
      <button id="btn-exit-to-menu" onclick="stopSidescroller(); showScreen('start')">Zum Hauptmenü</button>
    </div>
    <div id="reward-panel" class="hidden"></div>
  </div>

  <div id="screen-deckbuilder" class="screen hidden"></div>

</div>

<!-- Reihenfolge wichtig: cards/save zuerst, dann die Screens, dann game.js zuletzt -->
<script src="cards.js"></script>
<script src="save.js"></script>
<script src="sidescroller.js"></script>
<script src="deckbuilder.js"></script>
<script src="game.js"></script>
</body>
</html>
